[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satyalens-analysis"
version = "1.0.0"
description = "SatyaLens Person 1 — AI Detection & Evidence Analysis Package"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

# Core dependencies (always required)
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Audio deepfake detection dependencies (heavy; install separately)
audio = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.35.0",
    "huggingface_hub>=0.19.0",
]

# ML text classifier (TF-IDF + Logistic Regression). joblib ships with scikit-learn.
# Without it, the text_classifier component returns status='unavailable'.
ml = [
    "scikit-learn>=1.3.0",
]

# Development and testing
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["satyalens_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
